name: sakina
description: "Sakina - denna islamska rutina a brana pred rusivymi appkami."
publish_to: 'none'

version: 0.9.0+2

environment:
  sdk: ^3.13.0
  # Presna verzia Fluttera pre CI (subosito/flutter-action flutter-version-file).
  flutter: 3.47.8

# U-02: RTL lint ako balik v pub workspace (jeden pubspec.lock).
workspace:
  - packages/sakina_lints

dependencies:
  adhan_dart: ^2.0.1
  clock: ^1.1.3
  crypto: ^3.0.6
  cryptography: ^2.9.0
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.1
  go_router: ^18.1.2
  hijri: ^3.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  posthog_flutter: ^5.58.1
  riverpod_annotation: ^4.0.7
  sensors_plus: ^7.1.1
  sentry_flutter: ^10.2.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqlite3: ^3.8.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

dev_dependencies:
  alchemist: ^0.14.1
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  patrol: ^4.10.0
  pigeon: ^29.0.12
  riverpod_generator: ^4.0.9
  sakina_lints:
    path: packages/sakina_lints
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  # U-01: pribalene OFL fonty (docs/01 2.3.1, docs/09 2.7), licencie v
  # assets/fonts/*/OFL.txt. Ziadny KFGQPC.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
    - family: Literata
      fonts:
        - asset: assets/fonts/literata/Literata-Regular.ttf
        - asset: assets/fonts/literata/Literata-Italic.ttf
          style: italic
        - asset: assets/fonts/literata/Literata-SemiBold.ttf
          weight: 600
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/amiri_quran/AmiriQuran.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/noto_naskh_arabic/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/noto_naskh_arabic/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto_naskh_arabic/NotoNaskhArabic-SemiBold.ttf
          weight: 600
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/noto_nastaliq_urdu/NotoNastaliqUrdu-Regular.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/noto_sans_bengali/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/noto_sans_bengali/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto_sans_bengali/NotoSansBengali-SemiBold.ttf
          weight: 600

  # Licencie fontov pre LicenseRegistry (lib/ui/fonts/font_licenses.dart).
  assets:
    - assets/fonts/inter/OFL.txt
    - assets/fonts/literata/OFL.txt
    - assets/fonts/amiri_quran/OFL.txt
    - assets/fonts/noto_naskh_arabic/OFL.txt
    - assets/fonts/noto_nastaliq_urdu/OFL.txt
    - assets/fonts/noto_sans_bengali/OFL.txt
    # D-03: pribalena content.db a manifest (tool/bundle_content.sh,
    # gitignored; adresar drzi assets/content/.gitignore).
    - assets/content/
