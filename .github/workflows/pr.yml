# PR check podla docs/06 D.2. Piny akcii su SHA (overene 2026-10-29),
# aktualizuje ich Dependabot.
name: PR check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml # environment.flutter: "3.47.8"
          cache: true

      - name: Dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: tool/check.sh (codegen, format, analyze, forbidden patterns, tests, coverage)
        run: ./tool/check.sh

      - name: Working tree is clean after codegen
        run: git diff --exit-code || (echo "::error::Generated code or merged ARB is stale. Run ./tool/check.sh and commit." && exit 1)

      - name: DB migration tests
        run: |
          if [ -d test/data/migrations ]; then
            flutter test test/data/migrations
          else
            echo "No migration tests yet, skipped."
          fi

  android-build:
    # Overi, ze release build (R8, obfuskacia) prejde. Bez podpisu, bez secrets.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: check
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # gradle-wrapper.jar nie je v repe (generuje ho Flutter).
          min-wrapper-count: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build release APK prodLite (debug-signed, R8 + obfuscate)
        # Flavor (env x edition) sa cita z appFlavor, preto staci lib/main.dart.
        env:
          SAKINA_CI_UNSIGNED: 'true'
        run: |
          flutter build apk --release --flavor prodLite \
            --obfuscate --split-debug-info=build/symbols
      - name: Lite manifest without gate permissions
        run: ./tool/check_manifest.sh build/app/outputs/flutter-apk/app-prodlite-release.apk
      - name: Build debug APK devFull
        run: flutter build apk --debug --flavor devFull
