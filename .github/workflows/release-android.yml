# Release Android podla docs/06 D.3: tag vX.Y.Z alebo rucne -> AAB prodLite
# (R8 + obfuskacia Dartu) -> Google Play (internal/alpha) + symboly.
# Piny akcii su plne SHA (docs/06 D.1), aktualizuje ich Dependabot.
#
# Secrets (GitHub environment `play-release`, docs/06 D.6), zatial placeholdery:
#   ANDROID_UPLOAD_KEYSTORE_B64, ANDROID_UPLOAD_KEYSTORE_PASSWORD,
#   ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD,
#   PLAY_SERVICE_ACCOUNT_JSON, SENTRY_DSN, SENTRY_AUTH_TOKEN, POSTHOG_API_KEY
# Variables: SENTRY_ORG, SENTRY_PROJECT, SENTRY_UPLOAD_ENABLED ('true' az po D-04).
#
# Variables appky (environment `play-release`, nie su tajne, idu do --dart-define):
#   PRIVACY_POLICY_URL  napr. https://<projekt>.pages.dev/privacy (M-17); bez nej
#                       riadok "Privacy policy" v Settings > About chyba
#   FEEDBACK_URL        napr. mailto:<EMAIL> alebo https://.../feedback; bez nej
#                       riadok "Send feedback" chyba
#   CONTENT_REPO        <org>/prosoche-content; bez nej release nema aktualizacie
#                       obsahu ani stahovanie vysvetliviek hadisov
# Placeholdery: kym MAJITEL hodnoty nenastavi, build zlyha (kontrola nizsie).
# APP_VERSION netreba: appka ju cita z FLUTTER_BUILD_NAME (--build-name z pubspec).
name: Release Android

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        type: choice
        options: [internal, alpha]
        default: internal
      release_status:
        description: 'Play release status (draft, kym appka nebola nikdy publikovana)'
        type: choice
        options: [completed, draft]
        default: completed
      in_app_update_priority:
        description: 'In-app update priority 0-5 (neda sa neskor zmenit)'
        type: choice
        options: ['0', '1', '3', '5']
        default: '1'

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: play-release # secrets su len tu; required reviewer + pravidlo pre tagy v*
    permissions:
      contents: write # len kvoli prilozeniu symbolov ku GitHub Release
    env:
      PACKAGE_NAME: app.prosoche
      FLAVOR: prodLite
      AAB: build/app/outputs/bundle/prodLiteRelease/app-prod-lite-release.aab
      MAPPING: build/app/outputs/mapping/prodLiteRelease/mapping.txt
      TRACK: ${{ inputs.track || 'internal' }}
      RELEASE_STATUS: ${{ inputs.release_status || 'completed' }}
      PRIORITY: ${{ inputs.in_app_update_priority || '1' }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gradle-wrapper.jar nie je v repe (generuje ho Flutter SDK), preto
      # min-wrapper-count 0: overi kazdy jar, ktory by sa do repa dostal.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          min-wrapper-count: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml # environment.flutter
          cache: true

      - name: Compute version
        id: ver
        run: |
          NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          CODE=$((10000 + GITHUB_RUN_NUMBER))
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${NAME}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version ${NAME}"
            exit 1
          fi
          {
            echo "name=${NAME}"
            echo "code=${CODE}"
          } >> "$GITHUB_OUTPUT"
          echo "Version ${NAME}+${CODE}"

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_UPLOAD_KEYSTORE_B64 chyba (docs/06 B.3, D.6)"
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Check app variables
        env:
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
          CONTENT_REPO: ${{ vars.CONTENT_REPO }}
        run: |
          missing=0
          for v in PRIVACY_POLICY_URL FEEDBACK_URL CONTENT_REPO; do
            if [ -z "${!v}" ]; then
              echo "::error::Variable $v chyba (environment play-release)"
              missing=1
            fi
          done
          case "$PRIVACY_POLICY_URL" in https://*) ;; *) echo "::error::PRIVACY_POLICY_URL musi byt https://"; missing=1 ;; esac
          if ! echo "$CONTENT_REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::CONTENT_REPO musi byt <org>/<repo>"
            missing=1
          fi
          exit $missing

      - run: flutter pub get --enforce-lockfile

      - name: Build AAB (prodLite, R8, obfuscated)
        env:
          # Bez key.properties build zlyha namiesto debug podpisu.
          PROSOCHE_REQUIRE_RELEASE_SIGNING: 'true'
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # PostHog EU projekt (M-10); bez kluca sa analytika nikdy nespusti.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
          CONTENT_REPO: ${{ vars.CONTENT_REPO }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        # Flavor (env x edition) sa cita z appFlavor, preto staci lib/main.dart.
        run: |
          flutter build appbundle --release --flavor "$FLAVOR" \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_ENVIRONMENT=prod \
            --dart-define=SENTRY_RELEASE="prosoche@${VERSION_NAME}+${VERSION_CODE}" \
            --dart-define=SENTRY_DIST="$VERSION_CODE" \
            --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            --dart-define=PRIVACY_POLICY_URL="$PRIVACY_POLICY_URL" \
            --dart-define=FEEDBACK_URL="$FEEDBACK_URL" \
            --dart-define=CONTENT_REPO="$CONTENT_REPO"

      - name: Lite manifest without gate permissions
        run: ./tool/check_manifest.sh --edition lite build/app/intermediates/merged_manifests/prodLiteRelease/processProdLiteReleaseManifest/AndroidManifest.xml

      - name: Verify AAB signature and size
        run: |
          jarsigner -verify "$AAB" | grep -q "jar verified"
          if keytool -printcert -jarfile "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::AAB je podpisany debug klucom"
            exit 1
          fi
          SIZE=$(stat -c%s "$AAB")
          echo "AAB size: $SIZE (vratane BUNDLE-METADATA: R8 mapping, native symboly)"
          if [ "$SIZE" -ge 60000000 ]; then
            echo "::warning::AAB larger than 60 MB"
          fi

      # D-04: po pridani sentry_dart_plugin do pubspec (sentry: upload_debug_symbols,
      # symbols_path: build/symbols) nastavit variable SENTRY_UPLOAD_ENABLED=true.
      # ProGuard mapping: ak plugin nenahrava, doplnit sentry-cli upload-proguard [OVERIT].
      - name: Upload symbols to Sentry
        if: vars.SENTRY_UPLOAD_ENABLED == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: prosoche@${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.code }}
          SENTRY_DIST: ${{ steps.ver.outputs.code }}
        run: dart run sentry_dart_plugin

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.AAB }}
          track: ${{ env.TRACK }}
          status: ${{ env.RELEASE_STATUS }}
          inAppUpdatePriority: ${{ env.PRIORITY }}
          mappingFile: ${{ env.MAPPING }}
          # Q-04 (distribution/); chybajuci adresar je len warning akcie.
          whatsNewDirectory: distribution/whatsnew

      - name: Archive AAB and symbols (90 days)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: |
            ${{ env.AAB }}
            build/symbols
            ${{ env.MAPPING }}
          retention-days: 90
          if-no-files-found: ignore

      - name: Attach symbols to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # Pozn.: ak je repo verejne, symboly NEDAVAT do verejneho release (pomahaju RE).
        run: |
          tar czf symbols.tgz build/symbols "$MAPPING"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --draft
          gh release upload "$GITHUB_REF_NAME" symbols.tgz --clobber

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties
